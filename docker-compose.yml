services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payment_ops}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-payment_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: payment-ops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres-adminer:
    image: adminer:4
    container_name: payment-ops-postgres-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: payment-ops-redis-insight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data

volumes:
  postgres-data:
  redis-data:
  redis-insight-data:
